<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MOK TEST - Edukar Academy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0c29;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo span {
            font-size: 50px;
        }

        h1 {
            color: white;
            font-size: 28px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            margin-top: 5px;
        }

        /* Card */
        .card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: fadeInUp 0.5s ease;
            transition: transform 0.3s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-2px);
        }

        /* Progress */
        .progress-section {
            margin-bottom: 20px;
        }

        .progress-bar-container {
            background: rgba(255,255,255,0.25);
            border-radius: 30px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            border-radius: 30px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-text {
            text-align: center;
            color: white;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Question */
        .question-text {
            font-size: 22px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .option {
            background: #f8f9ff;
            border: 2px solid #e8ecf1;
            border-radius: 20px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option:hover {
            border-color: #667eea;
            background: #f0f2ff;
            transform: translateX(5px);
        }

        .option.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: white;
            box-shadow: 0 5px 15px rgba(102,126,234,0.3);
        }

        .option-letter {
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.25s;
        }

        .option.selected .option-letter {
            background: white;
            color: #667eea;
            transform: scale(1.05);
        }

        .option-text {
            flex: 1;
            font-size: 16px;
            font-weight: 500;
        }

        /* Written input */
        .written-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e8ecf1;
            border-radius: 20px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: all 0.25s;
            background: #f8f9ff;
        }

        .written-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        /* Button */
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(102,126,234,0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 50px;
            color: white;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error card */
        .error-card {
            text-align: center;
            background: rgba(255,255,255,0.98);
        }

        .error-icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        /* Result card */
        .result-card {
            text-align: center;
            background: white;
        }

        .score-circle {
            width: 160px;
            height: 160px;
            margin: 20px auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            box-shadow: 0 15px 35px rgba(102,126,234,0.3);
            animation: pulse 1s ease;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .score-number {
            font-size: 48px;
            font-weight: 800;
        }

        .score-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .result-stats {
            margin: 25px 0;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 24px;
        }

        .result-stats p {
            margin: 8px 0;
            font-size: 16px;
        }

        .result-stats strong {
            color: #667eea;
            font-size: 18px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 480px) {
            body { padding: 15px; }
            .card { padding: 20px; }
            .question-text { font-size: 18px; }
            .option { padding: 12px 16px; }
            .option-letter { width: 30px; height: 30px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <span>📚</span>
            </div>
            <h1>Edukar Academy</h1>
            <div class="subtitle">MOK TEST</div>
        </div>
        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Test yuklanmoqda...</p>
            </div>
        </div>
    </div>

    <script>
        // URL parametrlarini olish
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        const secretKey = urlParams.get('secret_key');
        const API_URL = window.location.origin;

        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let questions = [];
        let currentIndex = 0;
        let answers = [];

        // ========== AUTENTIFIKATSIYA ==========
        async function authenticate() {
            if (!userId || !secretKey) {
                showError("🔑 Xatolik!", "Noto'g'ri havola. Iltimos, bot orqali qaytadan urinib ko'ring.");
                return;
            }

            console.log("🔐 Authenticating...");

            try {
                const response = await fetch(`${API_URL}/api/auth/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: parseInt(userId),
                        secret_key: secretKey
                    })
                });
                const data = await response.json();

                if (data.success) {
                    loadQuestions();
                } else {
                    if (data.error === 'test_not_active') {
                        showError("⏳ Test hali boshlanmagan!", "Administrator testni boshlaganini kuting.");
                    } else {
                        showError("⛔ Ruxsat yo'q!", "Sizning kodingiz noto'g'ri. Iltimos, bot orqali qaytadan urinib ko'ring.");
                    }
                }
            } catch (error) {
                console.error("Auth error:", error);
                showError("❌ Xatolik!", "Server bilan bog'liq muammo yuz berdi.");
            }
        }

        function showError(title, message) {
            document.getElementById('content').innerHTML = `
                <div class="card error-card">
                    <div class="error-icon">❌</div>
                    <h3>${title}</h3>
                    <p style="color: #666; margin-top: 12px;">${message}</p>
                    <button class="btn" onclick="window.Telegram.WebApp.close()">Yopish</button>
                </div>
            `;
        }

        // ========== SAVOLLARNI YUKLASH ==========
        async function loadQuestions() {
            try {
                const response = await fetch(`${API_URL}/api/get_questions/`);
                const data = await response.json();

                if (data.success && data.questions.length > 0) {
                    questions = data.questions;
                    answers = new Array(questions.length).fill(null);
                    renderQuestion();
                } else {
                    document.getElementById('content').innerHTML = `
                        <div class="card" style="text-align:center">
                            <div class="error-icon">📭</div>
                            <h3>Hozircha savollar yo'q!</h3>
                            <p style="color: #666; margin-top: 12px;">Administrator savollarni qo'shgandan keyin test boshlanadi.</p>
                            <button class="btn" onclick="window.Telegram.WebApp.close()">Yopish</button>
                        </div>
                    `;
                }
            } catch (error) {
                console.error("Load questions error:", error);
                showError("❌ Xatolik!", "Savollarni yuklashda muammo yuz berdi.");
            }
        }

        // ========== SAVOLNI KO'RSATISH ==========
        function renderQuestion() {
            if (currentIndex >= questions.length) {
                submitTest();
                return;
            }

            const q = questions[currentIndex];
            const progress = ((currentIndex + 1) / questions.length) * 100;

            let optionsHtml = '';
            if (q.type === 'choice') {
                const letters = ['A', 'B', 'C', 'D'];
                optionsHtml = '<div class="options">';
                q.options.forEach((opt, i) => {
                    if (opt && opt.trim()) {
                        const isSelected = answers[currentIndex] === opt;
                        optionsHtml += `
                            <div class="option ${isSelected ? 'selected' : ''}" onclick="selectAnswer('${escapeHtml(opt)}')">
                                <div class="option-letter">${letters[i]}</div>
                                <div class="option-text">${escapeHtml(opt)}</div>
                            </div>
                        `;
                    }
                });
                optionsHtml += '</div>';
            } else {
                const currentAnswer = answers[currentIndex] || '';
                optionsHtml = `<textarea class="written-input" id="writtenAnswer" rows="4" placeholder="Javobingizni yozing...">${escapeHtml(currentAnswer)}</textarea>`;
            }

            const html = `
                <div class="progress-section">
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${progress}%"></div>
                    </div>
                    <div class="progress-text">${currentIndex + 1} / ${questions.length}</div>
                </div>
                <div class="card">
                    <div class="question-text">${escapeHtml(q.text)}</div>
                    ${optionsHtml}
                    <button class="btn" id="nextBtn" onclick="nextQuestion()">
                        ${currentIndex === questions.length - 1 ? '✅ Yakunlash' : '➡️ Keyingi savol'}
                    </button>
                </div>
            `;

            document.getElementById('content').innerHTML = html;

            if (q.type !== 'choice') {
                const textarea = document.getElementById('writtenAnswer');
                if (textarea) {
                    textarea.addEventListener('input', (e) => {
                        answers[currentIndex] = e.target.value;
                    });
                }
            }
        }

        function selectAnswer(answer) {
            answers[currentIndex] = answer;
            renderQuestion();
        }

        function nextQuestion() {
            if (answers[currentIndex] === null || answers[currentIndex] === '') {
                tg.showAlert("Iltimos, javob bering!");
                return;
            }
            currentIndex++;
            renderQuestion();
        }

        // ========== NATIJALARNI YUBORISH ==========
        async function submitTest() {
            const unanswered = answers.filter(a => a === null || a === '').length;
            if (unanswered > 0) {
                tg.showAlert(`⚠️ ${unanswered} ta savolga javob berilmagan!`);
                return;
            }

            tg.showConfirm("Testni yakunlamoqchimisiz?", async (confirmed) => {
                if (!confirmed) return;

                const formattedAnswers = [];
                for (let i = 0; i < questions.length; i++) {
                    formattedAnswers.push({
                        question_id: questions[i].id,
                        answer: answers[i]
                    });
                }

                try {
                    const response = await fetch(`${API_URL}/api/submit_result/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: parseInt(userId),
                            secret_key: secretKey,
                            answers: formattedAnswers
                        })
                    });
                    const result = await response.json();

                    if (result.success) {
                        showResult(result);
                    } else {
                        tg.showAlert("Xatolik: " + result.error);
                    }
                } catch (error) {
                    console.error("Submit error:", error);
                    tg.showAlert("Server bilan bog'liq xatolik!");
                }
            });
        }

        function showResult(result) {
            const scoreColor = result.score >= 70 ? '#10b981' : (result.score >= 50 ? '#f59e0b' : '#ef4444');
            document.getElementById('content').innerHTML = `
                <div class="card result-card" style="animation: fadeInUp 0.5s ease">
                    <div class="score-circle">
                        <div class="score-number">${Math.round(result.score)}%</div>
                        <div class="score-label">Ball</div>
                    </div>
                    <div class="result-stats">
                        <p>✅ <strong>To'g'ri javoblar:</strong> ${result.correct}</p>
                        <p>📋 <strong>Jami savollar:</strong> ${result.total}</p>
                        <p>📊 <strong>Natijangiz:</strong> ${result.correct}/${result.total}</p>
                    </div>
                    <button class="btn" onclick="window.Telegram.WebApp.close()">🎉 Yopish</button>
                </div>
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== BOSHLASH ==========
        authenticate();
    </script>
</body>
</html>
