<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MOK TEST - Edukar Academy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 24px; }
        .logo {
            width: 80px; height: 80px; background: white; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .logo span { font-size: 48px; }
        h1 { color: white; font-size: 24px; margin-bottom: 4px; }
        .subtitle { color: rgba(255,255,255,0.8); font-size: 14px; }
        .card {
            background: white; border-radius: 24px; padding: 24px;
            margin-bottom: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .question-text { font-size: 20px; font-weight: 600; color: #333; margin-bottom: 24px; line-height: 1.4; }
        .option {
            background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 16px;
            padding: 16px; margin-bottom: 12px; cursor: pointer;
            transition: all 0.2s ease; display: flex; align-items: center; gap: 12px;
        }
        .option:hover { border-color: #667eea; background: #f0f0ff; transform: translateX(4px); }
        .option.selected { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-color: #667eea; color: white; }
        .option-letter {
            width: 40px; height: 40px; background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; color: #667eea;
        }
        .option.selected .option-letter { background: white; color: #667eea; }
        .option-text { flex: 1; font-size: 16px; }
        .written-input {
            width: 100%; padding: 16px; border: 2px solid #e9ecef;
            border-radius: 16px; font-size: 16px; font-family: inherit;
            resize: vertical; transition: border-color 0.2s;
        }
        .written-input:focus { outline: none; border-color: #667eea; }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; padding: 16px 24px; border-radius: 16px;
            font-size: 16px; font-weight: 600; cursor: pointer; width: 100%;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.02); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .progress { background: rgba(255,255,255,0.2); border-radius: 20px; height: 8px; margin-bottom: 24px; overflow: hidden; }
        .progress-bar { background: white; height: 100%; border-radius: 20px; transition: width 0.3s ease; }
        .progress-text { text-align: center; color: white; font-size: 14px; margin-top: 8px; }
        .result-card { text-align: center; }
        .score-circle {
            width: 150px; height: 150px; margin: 20px auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; flex-direction: column; color: white;
        }
        .score-number { font-size: 48px; font-weight: bold; }
        .score-label { font-size: 14px; opacity: 0.9; }
        .result-stats { margin: 20px 0; padding: 16px; background: #f8f9fa; border-radius: 16px; }
        .loading { text-align: center; padding: 40px; color: white; }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        .error-card { text-align: center; }
        .error-icon { font-size: 64px; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) {
            .container { padding: 0; }
            .card { padding: 20px; }
            .question-text { font-size: 18px; }
            .option { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="header">
            <div class="logo"><span>📚</span></div>
            <h1>Edukar Academy</h1>
            <div class="subtitle">MOK TEST</div>
        </div>
        <div id="content"><div class="loading"><div class="spinner"></div><p>Test yuklanmoqda...</p></div></div>
    </div>
    <script>
        // Получаем параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        const secretKey = urlParams.get('secret_key');

        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let questions = [];
        let currentIndex = 0;
        let answers = [];
        let authChecked = false;

        // Отправка сообщения боту
        function sendToBot(data) {
            console.log("Sending to bot:", data);
            tg.sendData(JSON.stringify(data));
        }

        // Авторизация
        function authenticate() {
            if (!userId || !secretKey) {
                showError("🔑 Xatolik!", "Noto'g'ri havola. Iltimos, bot orqali qaytadan urinib ko'ring.");
                return;
            }
            
            sendToBot({
                action: 'auth',
                user_id: parseInt(userId),
                secret_key: secretKey
            });
        }

        function showError(title, message) {
            document.getElementById('content').innerHTML = `
                <div class="card error-card">
                    <div class="error-icon">❌</div>
                    <h3>${title}</h3>
                    <p style="color: #666; margin-top: 12px;">${message}</p>
                    <button class="btn" onclick="window.Telegram.WebApp.close()">Yopish</button>
                </div>
            `;
        }

        function showAccessDenied() {
            document.getElementById('content').innerHTML = `
                <div class="card error-card">
                    <div class="error-icon">⛔</div>
                    <h3>Ruxsat yo'q!</h3>
                    <p style="color: #666; margin-top: 12px;">Sizning kodingiz noto'g'ri yoki test hali boshlanmagan.</p>
                    <button class="btn" onclick="window.Telegram.WebApp.close()">Yopish</button>
                </div>
            `;
        }

        function loadQuestions(questionsData) {
            if (questionsData && questionsData.length > 0) {
                questions = questionsData;
                answers = new Array(questions.length).fill(null);
                authChecked = true;
                renderQuestion();
            } else {
                document.getElementById('content').innerHTML = `
                    <div class="card" style="text-align: center;">
                        <div class="error-icon">📭</div>
                        <h3>Hozircha savollar yo'q!</h3>
                        <p style="color: #666; margin-top: 12px;">Administrator savollarni qo'shgandan keyin test boshlanadi.</p>
                        <button class="btn" onclick="window.Telegram.WebApp.close()">Yopish</button>
                    </div>
                `;
            }
        }

        function renderQuestion() {
            if (currentIndex >= questions.length) {
                submitTest();
                return;
            }

            const question = questions[currentIndex];
            const progress = ((currentIndex + 1) / questions.length) * 100;
            let optionsHtml = '';

            if (question.type === 'choice') {
                const letters = ['A', 'B', 'C', 'D'];
                optionsHtml = '<div class="options">';
                question.options.forEach((opt, idx) => {
                    if (opt && opt.trim()) {
                        const isSelected = answers[currentIndex] === opt;
                        optionsHtml += `
                            <div class="option ${isSelected ? 'selected' : ''}" onclick="selectAnswer('${escapeHtml(opt).replace(/'/g, "\\'")}')">
                                <div class="option-letter">${letters[idx]}</div>
                                <div class="option-text">${escapeHtml(opt)}</div>
                            </div>
                        `;
                    }
                });
                optionsHtml += '</div>';
            } else {
                const currentAnswer = answers[currentIndex] || '';
                optionsHtml = `<textarea class="written-input" id="writtenAnswer" rows="4" placeholder="Javobingizni shu yerga yozing...">${escapeHtml(currentAnswer)}</textarea>`;
            }

            const html = `
                <div class="progress"><div class="progress-bar" style="width: ${progress}%"></div></div>
                <div class="progress-text">${currentIndex + 1} / ${questions.length}</div>
                <div class="card">
                    <div class="question-text">${escapeHtml(question.text)}</div>
                    ${optionsHtml}
                    <button class="btn" id="nextBtn" onclick="nextQuestion()">${currentIndex === questions.length - 1 ? '✅ Yakunlash' : '➡️ Keyingi savol'}</button>
                </div>
            `;

            document.getElementById('content').innerHTML = html;

            if (question.type !== 'choice') {
                const textarea = document.getElementById('writtenAnswer');
                if (textarea) {
                    textarea.addEventListener('input', (e) => {
                        answers[currentIndex] = e.target.value;
                    });
                }
            }
        }

        function selectAnswer(answer) {
            answers[currentIndex] = answer;
            renderQuestion();
        }

        function nextQuestion() {
            if (answers[currentIndex] === null || answers[currentIndex] === '') {
                tg.showAlert("Iltimos, javobni tanlang yoki yozing!");
                return;
            }
            currentIndex++;
            renderQuestion();
        }

        function submitTest() {
            const unanswered = answers.filter(a => a === null || a === '').length;
            if (unanswered > 0) {
                tg.showAlert(`⚠️ ${unanswered} ta savolga javob berilmagan!`);
                return;
            }

            tg.showConfirm("Testni yakunlamoqchimisiz?", (confirmed) => {
                if (!confirmed) return;

                const formattedAnswers = [];
                for (let i = 0; i < questions.length; i++) {
                    formattedAnswers.push({
                        question_id: questions[i].id,
                        answer: answers[i]
                    });
                }

                sendToBot({
                    action: 'submit',
                    user_id: parseInt(userId),
                    secret_key: secretKey,
                    answers: formattedAnswers
                });
            });
        }

        function showResult(result) {
            document.getElementById('content').innerHTML = `
                <div class="card result-card">
                    <div class="score-circle">
                        <div class="score-number">${Math.round(result.score)}%</div>
                        <div class="score-label">Ball</div>
                    </div>
                    <div class="result-stats">
                        <p>✅ To'g'ri javoblar: <strong>${result.correct}</strong></p>
                        <p>📋 Jami savollar: <strong>${result.total}</strong></p>
                        <p>📊 Natijangiz: <strong>${result.correct}/${result.total}</strong></p>
                    </div>
                    <button class="btn" onclick="window.Telegram.WebApp.close()">🎉 Yopish</button>
                </div>
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Обработка входящих сообщений от бота
        tg.onEvent('mainButtonClicked', function() {});
        
        // Запускаем авторизацию
        authenticate();
    </script>
</body>
</html>
